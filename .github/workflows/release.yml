name: Release builds

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            suffix: .exe
          - goos: windows
            goarch: arm64
            suffix: .exe
          - goos: linux
            goarch: amd64
            suffix: ''
          - goos: linux
            goarch: arm64
            suffix: ''
          - goos: darwin
            goarch: amd64
            suffix: ''
          - goos: darwin
            goarch: arm64
            suffix: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          name="devduck-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}"
          version="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then version="dev-dry-run"; fi
          go build -trimpath -ldflags "-X github.com/duck-ahiru-Z/DevDuck/internal/buildinfo.Version=${version} -X github.com/duck-ahiru-Z/DevDuck/internal/buildinfo.Commit=$(git rev-parse --short HEAD) -X github.com/duck-ahiru-Z/DevDuck/internal/buildinfo.BuildDate=$(date -u +%Y-%m-%d)" -o "dist/$name" ./cmd/duck
      - uses: actions/upload-artifact@v4
        with:
          name: devduck-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: sha256sum dist/* > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: devduck-release-dry-run
          path: dist/*
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'push'
        with:
          generate_release_notes: true
          files: dist/*
